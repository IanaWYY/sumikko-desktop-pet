<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixel Desktop Pet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pet App Container -->
  <div id="pet-app" class="pet-app">
    <!-- Character & Attached Bubble Wrapper -->
    <div id="pet-wrapper" class="pet-wrapper">
      <!-- Dialogue Bubble directly above character -->
      <div id="dialogue-bubble" class="bubble bubble-hidden">
        <span id="bubble-text">Safe in the corner...</span>
        <div class="bubble-tail"></div>
      </div>

      <!-- Main Character Display -->
      <div id="character-container" class="character-container idle size-tiny">
        <div id="svg-wrapper"></div>
      </div>

      <div id="emoji-picker" class="emoji-picker emoji-picker-hidden" aria-label="Choose an emoji"></div>

      <div id="opacity-editor" class="opacity-editor opacity-editor-hidden">
        <span class="opacity-editor-label">Change Opacity: <strong id="opacity-editor-value">100%</strong></span>
        <input id="opacity-editor-slider" type="range" min="35" max="100" value="100" step="5">
        <span class="opacity-editor-hint">Stops automatically after 3 seconds</span>
      </div>
    </div>

    <!-- Particle Canvas Layer -->
    <canvas id="particle-canvas"></canvas>
  </div>

  <!-- Custom Right-Click Context Menu -->
  <div id="context-menu" class="context-menu menu-hidden">
    <div class="menu-header">
      <span class="menu-title">Pixel Desktop Pet</span>
    </div>
    <div class="menu-divider"></div>
    
    <div class="menu-item" id="btn-select-char">
      <span class="icon">🐾</span>
      <span>Switch Character...</span>
      <span class="arrow">›</span>
    </div>

    <div class="menu-item" id="btn-toggle-size">
      <span class="icon">🔍</span>
      <span id="text-pet-size">Size: Tiny (1/4th)</span>
    </div>

    <div class="menu-item" id="btn-opacity">
      <span class="icon">◐</span>
      <span>Change Opacity</span>
      <span class="arrow">›</span>
    </div>

    <div class="menu-item menu-item-static">
      <span class="icon">♡</span>
      <span id="text-click-count">Clicks: 0</span>
    </div>

    <div class="menu-divider"></div>

    <div class="menu-item" id="btn-hide-pet">
      <span class="icon">🙈</span>
      <span>Hide Pet (Cmd+Shift+P)</span>
    </div>

    <div class="menu-divider"></div>

    <div class="menu-item danger" id="btn-quit-pet">
      <span class="icon">🚪</span>
      <span>Quit Pet</span>
    </div>
  </div>

  <!-- Character Selector Modal -->
  <div id="selector-modal" class="modal modal-hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Choose Your Pet</h3>
        <button id="modal-close-btn" class="close-btn">&times;</button>
      </div>
      <div id="character-grid" class="character-grid">
        <!-- Dynamically Populated -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/characters.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
